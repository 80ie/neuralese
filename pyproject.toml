[project]
name = "neuralese"
version = "0.1.0"
description = "Experiments with soft-token recurrent reasoning"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.10",
    "safetensors>=0.6",
    "textual>=6.6,<7",
    "transformers>=5.9,<6",
]

[project.scripts]
neuralese = "neuralese:main"
neuralese-tui = "neuralese_tui:main"

[tool.setuptools]
py-modules = ["neuralese", "neuralese_tui"]
